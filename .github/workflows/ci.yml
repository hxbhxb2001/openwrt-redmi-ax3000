name: OpenWRT C8809 Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache /usr/share/swift
          sudo apt clean
          sudo apt autoremove -y
          df -h | grep -v tmpfs
        continue-on-error: true

      - name: 安装依赖
        run: |
          sudo apt update -qq >/dev/null 2>&1
          sudo apt install -y -qq \
            build-essential clang flex g++ gawk gcc-multilib gettext \
            git libncurses5-dev libssl-dev python3 python3-distutils \
            rsync unzip wget curl zlib1g-dev file >/dev/null 2>&1

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'recursive'
        env:
          ACTIONS_STEP_DEBUG: false
          GIT_TRACE: 0

      - name: 缓存下载文件
        uses: actions/cache@v3
        with:
          path: dl
          key: ${{ runner.os }}-openwrt-dl-${{ hashFiles('**/feeds.conf.default') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-dl-

      - name: 配置版本信息和仓库地址
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          echo "ci-${GITHUB_RUN_STARTED_AT//[-:T]/}-${GITHUB_SHA:0:8}" > version
          sed -i "s|%U/targets/%S/packages|https://${OWNER}.github.io/${REPO}/${GITHUB_REF_NAME}/%R|" include/feeds.mk

      - name: 更新并安装软件源
        run: |
          ./scripts/feeds update -a -qq >/dev/null 2>&1
          ./scripts/feeds install -a -qq >/dev/null 2>&1

      - name: 配置编译选项（仅C8809）
        run: |
          cat <<EOF | sed -E 's/^  //' >.config
            # 基础平台配置（IPQ50xx）
            CONFIG_TARGET_ipq50xx=y
            CONFIG_TARGET_ipq50xx_arm=y
            CONFIG_TARGET_ipq50xx_arm_DEVICE_qcom_ipq5018-c8809=y  # 仅启用C8809设备
            CONFIG_TARGET_PER_DEVICE_ROOTFS=y  # 为每个设备生成独立根文件系统

            # 禁用多设备和全设备编译
            # CONFIG_TARGET_MULTI_PROFILE is not set  # 关闭多设备支持
            # CONFIG_TARGET_ALL_PROFILES is not set   # 关闭全设备编译

            # 其他必要配置
            CONFIG_IB=y
            # CONFIG_IB_STANDALONE is not set
            CONFIG_SDK=y
            CONFIG_MAKE_TOOLCHAIN=y
            CONFIG_ALL_NONSHARED=y
            CONFIG_REPRODUCIBLE_DEBUG_INFO=y

            # 软件包配置（保留中文支持）
            CONFIG_PACKAGE_luci=y
            CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
            CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
            CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y
            CONFIG_PACKAGE_wget=y
            CONFIG_PACKAGE_curl=y
            CONFIG_PACKAGE_htop=y
            CONFIG_PACKAGE_openssh-server=y
          EOF
          make defconfig >/dev/null

      - name: 下载源码包
        run: |
          if ! make -j$(nproc) download -s; then
            echo "下载失败，重试并显示详细信息..."
            make -j1 download V=s
          fi

      - name: 构建工具和工具链
        run: |
          make -j4 tools/install -s
          make -j4 toolchain/install -s

      - name: 构建C8809固件
        run: |
          if ! make -j4 -s; then
            echo "构建失败，重新构建并显示详细信息..."
            make -j1 V=s
          fi

      - name: 整理C8809构建产物
        run: |
          mkdir -p output
          # 仅复制C8809相关文件（假设固件名包含c8809关键字）
          cp bin/targets/ipq50xx/arm/*c8809* output/
          cp version output/

      - name: 上传C8809固件
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-c8809-${{ github.sha }}
          path: output/
          retention-days: 7

      - name: 构建失败通知
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: `C8809构建失败: [查看详情](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            })
