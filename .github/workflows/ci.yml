name: CI 编译自定义固件

on:
  workflow_dispatch:  # 支持手动触发
  push:
    branches: [ main ]  # 限制仅主分支推送时触发

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt clean && sudo apt autoremove -y
          df -h

      - name: 安装依赖工具
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang flex g++ gawk gcc-multilib gettext \
            git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            jq

      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 配置opkg软件源URL
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if ! TIME=$(curl -s --max-time 10 "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" | jq -r .created_at); then
            echo "获取时间失败，使用当前时间替代"
            TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          fi
          echo "ci-$(date -d "${TIME}" -u +'%Y%m%d-%H%M%S')-${GITHUB_SHA:0:8}" > version
          sed -i "s|%U/targets/%S/packages|https://${OWNER}.github.io/${REPO}/${GITHUB_REF_NAME}/%R|" include/feeds.mk

      - name: 更新并安装feeds
        run: |
          ./scripts/feeds update -a && ./scripts/feeds install -a
          if [ $? -ne 0 ]; then
            echo "feeds安装失败，重试一次"
            ./scripts/feeds update -a && ./scripts/feeds install -a
          fi

      - name: 应用自定义配置（含中文包）
        run: |
          cat <<EOF | sed -E 's/^  //' > .config
            CONFIG_TARGET_ipq50xx=y
            CONFIG_TARGET_ipq50xx_arm=y
            CONFIG_TARGET_MULTI_PROFILE=y
            # CONFIG_TARGET_ALL_PROFILES=y  # 按需开启
            CONFIG_TARGET_PER_DEVICE_ROOTFS=y

            CONFIG_IB=y
            # CONFIG_IB_STANDALONE is not set
            # CONFIG_SDK=y  # 按需开启
            # CONFIG_MAKE_TOOLCHAIN=y  # 按需开启

            CONFIG_ALL_NONSHARED=y
            # CONFIG_REPRODUCIBLE_DEBUG_INFO=y  # 按需开启

            # 基础LuCI界面
            CONFIG_PACKAGE_luci=y

            # 中文语言支持（核心）
            CONFIG_PACKAGE_luci-i18n-base-zh-cn=y  # LuCI基础组件中文包
            CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y  # 防火墙中文包
            CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y  # 软件包管理中文包

            # 扩展中文包（按需添加，减少固件体积）
            # CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y  # DDNS中文包
            # CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y  # UPnP中文包
            # CONFIG_PACKAGE_luci-i18n-nlbwmon-zh-cn=y  # 流量监控中文包
          EOF
          make defconfig && cat .config | grep -E 'CONFIG_TARGET|CONFIG_PACKAGE_luci'

      - name: 下载依赖包
        run: |
          make -j$(nproc) download || make -j1 download

      - name: 编译工具
        run: |
          make -j2 tools/install

      - name: 编译工具链
        run: |
          make -j2 toolchain/install

      - name: 编译固件
        run: |
          make -j2 V=s

      - name: 上传固件到Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bin-ipq50xx-arm
          path: bin/targets/ipq50xx/arm/*
          retention-days: 7

      - name: 上传源码包（可选）
        uses: actions/upload-artifact@v4
        with:
          name: dl-packages
          path: dl/*
          retention-days: 3
