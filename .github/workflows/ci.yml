name: OpenWRT ipq50xx Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache
          sudo apt clean && sudo apt autoremove -y
        continue-on-error: true

      - name: 安装依赖
        run: |
          sudo apt update -qq
          sudo apt install -y build-essential clang flex g++ gawk gcc-multilib gettext \
            git libncurses5-dev libssl-dev python3 rsync unzip wget zlib1g-dev file

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'recursive'

      - name: 缓存下载文件
        uses: actions/cache@v3
        with:
          path: dl
          key: ${{ runner.os }}-openwrt-dl-${{ hashFiles('**/feeds.conf.default') }}

      - name: 配置软件源
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 配置ipq50xx编译选项（包含U-Boot）
        run: |
          cat <<EOF >.config
          # 基础平台配置
          CONFIG_TARGET_ipq50xx=y
          CONFIG_TARGET_ipq50xx_arm=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_ALL_PROFILES=y
          CONFIG_TARGET_PER_DEVICE_ROOTFS=y

          # 启用U-Boot编译
          CONFIG_BUILD_UBOOT=y
          CONFIG_PACKAGE_u-boot=y
          CONFIG_PACKAGE_u-boot-ipq50xx=y

          # 基础功能
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y
          EOF
          make defconfig

      - name: 下载源码
        run: make -j$(nproc) download V=s

      - name: 构建固件和U-Boot
        run: make -j2 V=s

      - name: 提取构建产物（包含U-Boot）
        run: |
          mkdir -p output
          # 复制固件文件
          cp -r bin/targets/ipq50xx/arm/* output/
          # 查找并复制U-Boot文件
          find build_dir -name "u-boot-*.bin" -exec cp {} output/ \;
          find build_dir -name "u-boot-*.img" -exec cp {} output/ \;

      - name: 上传固件和U-Boot
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-ipq50xx-arm-with-uboot
          path: output/
          retention-days: 7
