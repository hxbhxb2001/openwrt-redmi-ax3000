name: OpenWRT C8809 Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache
          sudo apt clean && sudo apt autoremove -y
        continue-on-error: true

      - name: 安装依赖
        run: |
          sudo apt update -qq >/dev/null 2>&1
          sudo apt install -y -qq build-essential clang flex g++ gawk gcc-multilib gettext git libncurses5-dev libssl-dev python3 rsync unzip wget zlib1g-dev file >/dev/null 2>&1

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 缓存下载文件
        uses: actions/cache@v3
        with:
          path: dl
          key: ${{ runner.os }}-openwrt-dl-${{ hashFiles('**/feeds.conf.default') }}

      - name: 配置软件源
        run: |
          ./scripts/feeds update -a -qq >/dev/null 2>&1
          ./scripts/feeds install -a -qq >/dev/null 2>&1

      - name: 配置C8809编译选项
        run: |
          cat <<EOF >.config
          CONFIG_TARGET_ipq50xx=y
          CONFIG_TARGET_ipq50xx_arm=y
          CONFIG_TARGET_ipq50xx_arm_DEVICE_qcom_ipq5018-c8809=y
          CONFIG_TARGET_PER_DEVICE_ROOTFS=y

          # 基础功能
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y
          EOF
          make defconfig >/dev/null

      - name: 下载源码
        run: make -j$(nproc) download -s || make -j1 download V=s

      - name: 构建固件
        run: make -j4 -s || make -j1 V=s

      - name: 提取C8809固件
        run: |
          mkdir -p output
          cp bin/targets/ipq50xx/arm/*c8809* output/

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-c8809
          path: output/
          retention-days: 7
